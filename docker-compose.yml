version: '3.8'

services:
  aegis-voice:
    build: .
    container_name: aegis-voice-app
    ports:
      - "8000:8000"
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=groq
      - TTS_PROVIDER=edge
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
